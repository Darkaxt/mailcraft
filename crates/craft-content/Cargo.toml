[package]
name = "craft-content"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Versioned located native text and local OCR contract for Craft consumers"

[lints]
workspace = true

[features]
default = ["html"]
html = ["dep:html5ever"]
runtime = ["dep:process-wrap", "dep:win32job", "dep:cosca", "dep:windows", "dep:ring", "dep:tempfile"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
html5ever = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
process-wrap = { workspace = true, optional = true }
win32job = { workspace = true, optional = true }
cosca = { workspace = true, optional = true }
windows = { version = "0.62.2", features = ["Win32_System_Threading"], optional = true }
ring = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

